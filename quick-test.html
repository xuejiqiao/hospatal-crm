<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API快速测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .test-section h2 {
            color: #007bff;
            margin-top: 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .response {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            max-height: 400px;
            overflow: auto;
        }
        .response.success {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        .response.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
        }
        .url-display {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            word-break: break-all;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CRM API 快速测试工具</h1>
        
        <div class="test-section">
            <h2>📍 基础配置</h2>
            <label><strong>API地址:</strong></label>
            <input type="text" id="apiUrl" value="http://127.0.0.3">
            <div class="url-display">
                <strong>完整API URL:</strong> <span id="fullUrl">http://127.0.0.3/api.php</span>
            </div>
        </div>

        <div class="test-section">
            <h2>1️⃣ 测试医院列表接口 (无需登录)</h2>
            <button onclick="testHospitalList()">获取医院列表</button>
            <div id="hospitalResponse" class="response" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>2️⃣ 测试微信登录接口</h2>
            <p style="color: #666; font-size: 14px;">
                注意: 需要真实的微信登录code，这里可以测试接口是否可达
            </p>
            <button onclick="testLogin()">测试登录接口</button>
            <div id="loginResponse" class="response" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>3️⃣ 系统信息</h2>
            <button onclick="testSystemInfo()">查看系统信息</button>
            <div id="systemResponse" class="response" style="display:none;"></div>
        </div>
    </div>

    <script>
        // 获取API基础URL
        function getApiUrl() {
            return document.getElementById('apiUrl').value.replace(/\/$/, '');
        }

        // 发送HTTP请求
        async function sendRequest(url, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (data && method !== 'GET') {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(url, options);
                const result = await response.json();
                return result;
            } catch (error) {
                return {
                    code: 500,
                    message: '请求失败: ' + error.message,
                    data: null,
                    error: error.message
                };
            }
        }

        // 显示响应结果
        function showResponse(elementId, data, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'response ' + (isSuccess ? 'success' : 'error');
            element.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }

        // 测试医院列表
        async function testHospitalList() {
            const baseUrl = getApiUrl();
            const url = baseUrl + '/api.php?module=hospital&action=getList&page=1&pageSize=10';
            
            const result = await sendRequest(url);
            showResponse('hospitalResponse', result, result.code === 200);
        }

        // 测试登录
        async function testLogin() {
            const baseUrl = getApiUrl();
            const url = baseUrl + '/api.php?module=wechat&action=login';
            
            const result = await sendRequest(url, 'POST', {
                code: 'test_code_123'
            });
            showResponse('loginResponse', result, result.code === 200);
        }

        // 测试系统信息
        function testSystemInfo() {
            const info = {
                api_url: getApiUrl() + '/api.php',
                test_urls: {
                    hospital_list: getApiUrl() + '/api.php?module=hospital&action=getList',
                    wechat_login: getApiUrl() + '/api.php?module=wechat&action=login',
                    reservation_create: getApiUrl() + '/api.php?module=reservation&action=create'
                },
                timestamp: new Date().toISOString()
            };
            showResponse('systemResponse', info, true);
        }

        // 更新URL显示
        document.getElementById('apiUrl').addEventListener('input', function() {
            document.getElementById('fullUrl').textContent = this.value.replace(/\/$/, '') + '/api.php';
        });
    </script>
</body>
</html>
